
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> </title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  cursor: pointer;
}
#screen {
  position: fixed;
  inset: 0;
  background: #000;
  transition: none;
}
#hint {
  position: fixed;
  bottom: 25px;
  width: 100%;
  text-align: center;
  color: #777;
  font: 12px monospace;
  letter-spacing: 4px;
}
</style>
</head>
<body>
<div id="screen"></div>
<div id="hint">CLICK TO BEGIN</div>

<script>
const screen = document.getElementById('screen');
const hint = document.getElementById('hint');

let running = false;
let timer = null;

function flash() {
  if (!running) return;

  const r = Math.random();

  if (r < 0.35) {
    screen.style.background = '#fff';
  } else if (r < 0.65) {
    screen.style.background = '#888';
  } else if (r < 0.82) {
    screen.style.background =
      'radial-gradient(ellipse, #fff 0%, #aaa 30%, #222 75%)';
  } else {
    screen.style.background = '#333';
  }

  const duration = 60 + Math.random() * 140;

  timer = setTimeout(() => {
    screen.style.background = '#000';
    timer = setTimeout(flash, 80 + Math.random() * 350);
  }, duration);
}

function toggle() {
  running = !running;

  if (running) {
    hint.textContent = 'CLICK TO STOP';
    flash();
  } else {
    clearTimeout(timer);
    screen.style.background = '#000';
    hint.textContent = 'CLICK TO BEGIN';
  }
}

document.body.addEventListener('click', toggle);
</script>
</body>
</html>
