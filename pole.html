
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: transparent;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

.poem {
  width: 90%;
  max-width: 900px;
  font-size: clamp(28px, 6vw, 68px);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -2px;
}

.line {
  display: block;
  white-space: nowrap;
  margin: 0 0 8px;
}

.char {
  display: inline-block;
  animation: tremble var(--speed) infinite;
  animation-delay: var(--delay);
  opacity: var(--opacity);
}

@keyframes tremble {
  0%, 100% {
    transform: translate(0, 0) rotate(0);
    opacity: 1;
  }
  15% {
    transform: translate(1px, -2px) rotate(-2deg);
  }
  30% {
    transform: translate(-2px, 1px) rotate(2deg);
    opacity: .65;
  }
  45% {
    transform: translate(2px, 2px) rotate(-1deg);
  }
  60% {
    transform: translate(-1px, -2px) rotate(1deg);
    opacity: .9;
  }
  80% {
    transform: translate(2px, -1px) rotate(2deg);
  }
}

.line:nth-child(2) .char {
  animation-name: tremble2;
}

@keyframes tremble2 {
  0%, 100% { transform: translate(0,0); }
  25% { transform: translate(-3px,2px) rotate(2deg); }
  50% { transform: translate(2px,-3px) rotate(-2deg); }
  75% { transform: translate(-2px,-1px); }
}

.line:nth-child(3) .char {
  animation-duration: calc(var(--speed) * 1.5);
}

.line:nth-child(4) .char {
  animation-name: tremble2;
  animation-duration: calc(var(--speed) * .7);
}

</style>
</head>
<body>

<div class="poem" id="poem"></div>

<script>
const lines = [
  "спитаєш лелеку",
  "де поле і море",
  "де море там поле",
  "далеко"
];

const poem = document.getElementById("poem");

lines.forEach((line, lineIndex) => {
  const row = document.createElement("div");
  row.className = "line";

  [...line].forEach((letter) => {
    const span = document.createElement("span");
    span.className = "char";
    span.textContent = letter === " " ? "\u00a0" : letter;

    span.style.setProperty("--speed",
      (0.12 + Math.random() * 0.35) + "s");

    span.style.setProperty("--delay",
      (Math.random() * -1) + "s");

    row.appendChild(span);
  });

  poem.appendChild(row);
});
</script>

</body>
</html>
