<style>
:root {
  --bg: #050505;
  --ink: #d9d9d9;
  --dim: #777;
  --accent: #e63946;
  --cyan: #00e5ff;
  --display: 'VT323', 'Courier New', monospace;
  --body: 'IBM Plex Mono', 'Courier New', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--bg); }
html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  overflow-x: hidden;
}
body.menu-open { overflow: hidden; }

::selection { background: var(--accent); color: #000; }

a:focus-visible,
button:focus-visible {
  outline: 1px dashed var(--accent);
  outline-offset: 3px;
}

/* ---------- CRT: сканлінії, віньєтка, мерехтіння ---------- */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 100vh;
  height: 100lvh;
  pointer-events: none;
  z-index: 100;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255, 255, 255, .035) 0,
    rgba(255, 255, 255, .035) 1px,
    transparent 1px,
    transparent 3px
  );
}
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 100vh;
  height: 100lvh;
  pointer-events: none;
  z-index: 101;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .55) 100%);
  animation: flicker 6s steps(1) infinite;
}
@keyframes flicker {
  0%, 100% { opacity: 1; }
  47% { opacity: 1; }
  48% { opacity: .75; }
  49% { opacity: 1; }
  80% { opacity: .85; }
  81% { opacity: 1; }
}

/* ---------- Поява (progressive enhancement) ---------- */
.fade-in { opacity: 1; }
.js .fade-in { opacity: 0; }
.js .fade-in.is-visible { animation: flickerIn .6s steps(1) forwards; }
@keyframes flickerIn {
  0%   { opacity: 0; }
  15%  { opacity: 1; }
  30%  { opacity: .15; }
  45%  { opacity: 1; }
  60%  { opacity: .4; }
  100% { opacity: 1; }
}

/* ---------- Гліч тексту (RGB-розщеплення) ---------- */
.glitch { position: relative; }
.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  clip-path: inset(0 0 100% 0);
  pointer-events: none;
}
.glitch::before {
  color: var(--cyan);
  transform: translateX(-4px);
  animation: glitchA 5s steps(1) infinite;
}
.glitch::after {
  color: var(--accent);
  transform: translateX(4px);
  animation: glitchB 5s steps(1) infinite;
}
@keyframes glitchA {
  0%, 88%, 100% { clip-path: inset(0 0 100% 0); }
  89% { clip-path: inset(10% 0 62% 0); }
  91% { clip-path: inset(55% 0 20% 0); }
  93% { clip-path: inset(80% 0 4% 0); }
  95% { clip-path: inset(30% 0 45% 0); }
}
@keyframes glitchB {
  0%, 89%, 100% { clip-path: inset(0 0 100% 0); }
  90% { clip-path: inset(60% 0 15% 0); }
  92% { clip-path: inset(5% 0 75% 0); }
  94% { clip-path: inset(40% 0 35% 0); }
  96% { clip-path: inset(85% 0 2% 0); }
}

/* ---------- Гліч зображень ---------- */
@keyframes imgGlitch {
  0%, 90%, 100% { transform: none; clip-path: none; filter: none; }
  91% { transform: translate(-6px, 0); clip-path: inset(15% 0 55% 0); filter: drop-shadow(5px 0 var(--accent)) drop-shadow(-5px 0 var(--cyan)); }
  93% { transform: translate(7px, 0); clip-path: inset(60% 0 10% 0); filter: drop-shadow(-5px 0 var(--accent)) drop-shadow(5px 0 var(--cyan)); }
  95% { transform: translate(-3px, 0); clip-path: inset(35% 0 40% 0); filter: hue-rotate(90deg); }
  97% { transform: none; clip-path: none; filter: none; }
}
@keyframes imgGlitchHover {
  0%   { transform: none; filter: none; clip-path: none; }
  20%  { transform: translate(-6px, 2px); filter: drop-shadow(5px 0 var(--accent)) drop-shadow(-5px 0 var(--cyan)); }
  40%  { transform: translate(6px, -2px); clip-path: inset(30% 0 30% 0); }
  60%  { transform: translate(-3px, 0); clip-path: none; filter: hue-rotate(90deg); }
  80%  { transform: translate(3px, 1px); filter: hue-rotate(-90deg); }
  100% { transform: none; filter: none; clip-path: none; }
}

/* ---------- Шапка ---------- */
header {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 20px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px 30px;
  position: relative;
}
header a { display: inline-block; }
header .logo { display: block; flex-shrink: 0; }
header img {
  display: block;
  width: 280px;
  max-width: 100%;
  height: auto;
  animation: imgGlitch 7s steps(1) infinite;
}
nav {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px 28px;
  flex-wrap: wrap;
}
nav a {
  color: var(--ink);
  text-decoration: none;
  font-family: var(--display);
  font-size: 26px;
  text-transform: uppercase;
  letter-spacing: 2px;
  padding: 0 4px;
}
nav a::before { content: '[ '; color: var(--dim); }
nav a::after  { content: ' ]'; color: var(--dim); }
nav a:hover {
  background: var(--ink);
  color: #000;
  animation: navShake .25s steps(2) 1;
}
nav a:hover::before,
nav a:hover::after { color: #000; }
@keyframes navShake {
  0%   { transform: translate(0); }
  33%  { transform: translate(-2px, 1px); text-shadow: 2px 0 var(--accent), -2px 0 var(--cyan); }
  66%  { transform: translate(2px, -1px); }
  100% { transform: translate(0); text-shadow: none; }
}

/* Кнопка-гамбургер (на десктопі прихована) */
.nav-toggle {
  display: none;
  position: relative;
  z-index: 95;
  flex-shrink: 0;
  width: 46px;
  height: 46px;
  padding: 0;
  background: transparent;
  border: 1px solid #555;
  border-radius: 0;
  color: var(--ink);
  cursor: pointer;
}
.nav-toggle span {
  position: absolute;
  left: 11px;
  right: 11px;
  height: 2px;
  background: currentColor;
  transition: transform .2s steps(3), opacity .2s steps(3);
}
.nav-toggle span:nth-child(1) { top: 14px; }
.nav-toggle span:nth-child(2) { top: 21px; }
.nav-toggle span:nth-child(3) { top: 28px; }
.nav-toggle:hover {
  background: var(--ink);
  color: #000;
  border-color: var(--ink);
  box-shadow: -3px 0 0 var(--cyan), 3px 0 0 var(--accent);
}
.nav-toggle[aria-expanded="true"] { border-color: var(--accent); }
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

main {
  flex: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 50px 20px 60px;
  text-align: center;
  width: 100%;
}

/* ---------- Hero ---------- */
.hero {
  position: relative;
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  border: 1px solid #3a3a3a;
  overflow: hidden;
}
.hero img {
  width: 100%;
  height: auto;
  display: block;
  animation: imgGlitch 9s steps(1) infinite 2s;
}
.hero::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 14%;
  top: -20%;
  pointer-events: none;
  background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, .09), transparent);
  animation: scan 6s linear infinite;
}
@keyframes scan {
  to { top: 110%; }
}

/* ---------- Альбом ---------- */
.album {
  text-align: center;
  margin-top: 100px;
}
.album-eyebrow {
  font-family: var(--display);
  font-size: 24px;
  letter-spacing: 4px;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 16px;
}
.album-title {
  font-family: var(--display);
  font-weight: 400;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: 1px;
  line-height: .9;
  font-size: clamp(52px, 12vw, 160px);
}
.album-title .accent { color: var(--accent); }
.album-date {
  font-family: var(--body);
  font-size: 15px;
  color: var(--dim);
  margin-top: 22px;
  letter-spacing: 3px;
}

.album-cover {
  display: block;
  max-width: 400px;
  width: 100%;
  margin: 60px auto 0;
  border: 1px solid #3a3a3a;
  box-shadow: -4px 0 0 var(--cyan), 4px 0 0 var(--accent);
  overflow: hidden;
}
.album-cover img {
  width: 100%;
  height: auto;
  display: block;
}
.album-cover:hover img {
  animation: imgGlitchHover .4s steps(1) 1;
}

.album-streams {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-top: 46px;
}
.album-streams a {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  color: var(--ink);
  font-size: 24px;
  text-decoration: none;
  border: 1px solid #555;
}
.album-streams a:hover {
  background: var(--ink);
  color: #000;
  border-color: var(--ink);
  box-shadow: -3px 0 0 var(--cyan), 3px 0 0 var(--accent);
}

/* ---------- Роздільник ---------- */
.divider {
  display: flex;
  align-items: center;
  gap: 16px;
  max-width: 700px;
  margin: 100px auto 80px;
  font-family: var(--display);
  font-size: 24px;
  letter-spacing: 3px;
  line-height: 1;
  color: var(--accent);
}
.divider::before,
.divider::after {
  content: '';
  flex: 1;
  border-top: 1px dashed #444;
}

/* ---------- Заголовок секції ---------- */
.section-label {
  font-family: var(--display);
  font-weight: 400;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: 2px;
  line-height: 1;
  font-size: clamp(30px, 5vw, 56px);
  margin-bottom: 40px;
}
.section-label::before { content: '> '; color: var(--accent); }
.section-label::after {
  content: '_';
  color: var(--accent);
  animation: blink 1s steps(1) infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}

/* ---------- Відео у «вікні» ---------- */
.window {
  max-width: 800px;
  margin: 0 auto;
  border: 1px solid var(--ink);
  box-shadow: 8px 8px 0 rgba(230, 57, 70, .55);
  text-align: left;
}
.window-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--ink);
  color: #000;
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 1px;
  padding: 2px 10px;
}
.video-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
}
.video-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

/* ---------- Футер ---------- */
footer {
  margin-top: 40px;
  padding: 28px 20px 0;
  position: relative;
  border-top: 1px dashed #444;
}

/* Рівень 1: підписка */
.newsletter {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px 24px;
  padding-bottom: 24px;
}
.newsletter-label {
  font-family: var(--display);
  font-size: 26px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ink);
}
.newsletter-label::before { content: '> '; color: var(--accent); }
.newsletter-form {
  display: flex;
  justify-content: center;
  gap: 10px;
}
.newsletter-input {
  background: transparent;
  border: 1px solid #555;
  color: var(--ink);
  padding: 12px 16px;
  font-family: var(--body);
  font-size: 15px;
  min-width: 280px;
  border-radius: 0;
  caret-color: var(--accent);
}
.newsletter-input::placeholder { color: #666; }
.newsletter-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: -3px 0 0 var(--cyan), 3px 0 0 var(--accent);
}
.newsletter-btn {
  padding: 12px 26px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 0;
}
.newsletter-btn:hover {
  background: var(--ink);
  color: #000;
  box-shadow: -3px 0 0 var(--cyan), 3px 0 0 var(--accent);
}

/* Рівень 2: соцмережі + службові посилання */
.footer-top {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px 24px;
  padding-bottom: 20px;
}
.footer-socials {
  display: flex;
  gap: 20px;
}
.footer-socials a {
  color: var(--ink);
  font-size: 20px;
  text-decoration: none;
}
.footer-socials a:hover {
  color: var(--accent);
  text-shadow: -2px 0 var(--cyan), 2px 0 var(--accent);
}
.footer-links {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 22px;
}
.footer-links a {
  font-family: var(--body);
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-decoration: none;
  white-space: nowrap;
  color: #808080;
}
.footer-links a::before { content: '[ '; }
.footer-links a::after  { content: ' ]'; }
.footer-links a:hover {
  color: var(--ink);
  text-shadow: -2px 0 var(--cyan), 2px 0 var(--accent);
}

/* Рівень 3: copyright */
.footer-bottom {
  max-width: 1100px;
  margin: 0 auto;
  text-align: center;
  color: #666;
  font-size: 13px;
  padding: 12px 0 16px;
  border-top: 1px solid #222;
}
.footer-bottom::after {
  content: '_';
  animation: blink 1s steps(1) infinite;
}

/* ---------- Планшет / мобільні: шапка + гамбургер ---------- */
@media (max-width: 800px) {
  /* Без JS: логотип по центру, меню нижче */
  header {
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    padding: 30px 15px 0;
  }
  header img { width: 240px; }
  nav {
    justify-content: center;
    gap: 6px 18px;
  }
  nav a { font-size: 22px; }

  /* З JS: логотип ліворуч, гамбургер праворуч */
  .js header {
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 20px 15px 0;
  }
  .js header img { width: 200px; }
  .js .nav-toggle { display: block; }

  /* Повноекранне меню: суцільний чорний фон на весь екран */
  .js nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100vh;
    height: 100lvh;
    min-height: 100%;
    z-index: 90;
    flex-direction: column;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
    gap: 30px;
    padding: 80px 20px;
    background: #050505;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .2s steps(3), visibility 0s linear .2s;
  }
  .js nav.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .2s steps(3);
  }
  .js nav a { font-size: 34px; }
}

/* ---------- Мобільні ---------- */
@media (max-width: 600px) {
  main { padding: 40px 15px; }
  .album { margin-top: 70px; }
  .album-cover { margin-top: 45px; max-width: 300px; }
  .divider { margin: 70px auto 60px; font-size: 20px; }
  .window { box-shadow: 5px 5px 0 rgba(230, 57, 70, .55); }
  footer { padding: 24px 15px 0; margin-top: 30px; }
  .newsletter { flex-direction: column; gap: 12px; }
  .newsletter-form { flex-direction: column; align-items: center; width: 100%; }
  .newsletter-input { width: 100%; max-width: 320px; min-width: 0; }
  .footer-top {
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 16px;
  }
  .footer-socials { flex-wrap: wrap; justify-content: center; }
  .footer-links { justify-content: center; gap: 8px 16px; }
}

/* ---------- Зменшений рух ---------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto !important; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .js .fade-in { opacity: 1; }
}
</style>

<body>

<header>
  <a href="/" class="logo"><img src="/images/francologo.png" alt="FRANCO"></a>
  <button type="button" class="nav-toggle" aria-label="Відкрити меню" aria-expanded="false" aria-controls="site-nav">
    <span></span><span></span><span></span>
  </button>
  <nav id="site-nav" aria-label="Головне меню">
    <a href="/music/">Музика</a>
    <a href="/videos/">Відео</a>
    <a href="/notes/">Нотатки</a>
    <a href="/about/">Про гурт</a>
  </nav>
</header>

<script>
  /* Поява при скролі */
  const fadeItems = document.querySelectorAll('.fade-in');

  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    fadeItems.forEach((el) => observer.observe(el));
  } else {
    fadeItems.forEach((el) => el.classList.add('is-visible'));
  }

  /* Мобільне меню */
  (function () {
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.getElementById('site-nav');
    if (!toggle || !nav) return;

    function setMenu(open) {
      nav.classList.toggle('is-open', open);
      document.body.classList.toggle('menu-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Закрити меню' : 'Відкрити меню');
    }

    toggle.addEventListener('click', () => {
      setMenu(!nav.classList.contains('is-open'));
    });

    /* Клік по пункту меню або по порожньому фону закриває меню */
    nav.addEventListener('click', (e) => {
      if (e.target === nav || e.target.closest('a')) setMenu(false);
    });

    /* Escape закриває меню і повертає фокус на кнопку */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && nav.classList.contains('is-open')) {
        setMenu(false);
        toggle.focus();
      }
    });

    /* Якщо екран розширився до десктопу, скидаємо стан */
    const mq = window.matchMedia('(min-width: 801px)');
    const onChange = (e) => { if (e.matches) setMenu(false); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  })();
</script>
